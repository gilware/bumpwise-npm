name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax
        run: node --check bin/bumpwise.js
      - name: Versions agree (launcher, package.json, server.json)
        run: |
          v=$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' bin/bumpwise.js)
          test -n "$v"
          test "$(node -p 'require("./package.json").version')" = "$v"
          test "$(node -p 'require("./server.json").version')" = "$v"
          test "$(node -p 'require("./server.json").packages[0].version')" = "$v"
          echo "version $v"
      - name: SHA-256 matches the published jar's checksum file
        run: |
          v=$(sed -n 's/^const VERSION = "\(.*\)";$/\1/p' bin/bumpwise.js)
          sha=$(sed -n 's/^const SHA256 = "\(.*\)";$/\1/p' bin/bumpwise.js)
          published=$(curl -fsSL -A bumpwise-internal/ci "https://gilware.com/bumpwise/cli/bumpwise-$v.jar.sha256" | cut -d' ' -f1)
          test "$sha" = "$published"
          echo "sha256 $sha"
      - name: Package contents
        run: npm pack --dry-run
